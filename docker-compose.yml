services:
  uiotg:
    build: .
    image: uiotg:latest
    restart: unless-stopped
    ports:
      # Host port from UIOTG_PORT in .env; uiotg listens on 8080 inside the container.
      - "${UIOTG_PORT:-8080}:8080"
    environment:
      # Required when exposed beyond localhost: clients send "Authorization: Bearer <token>".
      UIOTG_AUTH_TOKEN: ${UIOTG_AUTH_TOKEN:?set UIOTG_AUTH_TOKEN in .env}
      # Public base URL; when set, each render is also served at <url>/images/<file>.
      UIOTG_PUBLIC_URL: ${UIOTG_PUBLIC_URL:-}
      UIOTG_THEME: ${UIOTG_THEME:-light}
      UIOTG_TILE_URL: ${UIOTG_TILE_URL:-}
      UIOTG_TILE_ATTRIBUTION: ${UIOTG_TILE_ATTRIBUTION:-}
      UIOTG_TILE_CONTACT: ${UIOTG_TILE_CONTACT:-}
      UIOTG_UNSPLASH_ACCESS_KEY: ${UIOTG_UNSPLASH_ACCESS_KEY:-}
      UIOTG_PEXELS_API_KEY: ${UIOTG_PEXELS_API_KEY:-}
    # Chromium uses shared memory for rendering.
    shm_size: "1gb"
    mem_limit: 1536m
    volumes:
      - uiotg-images:/tmp/uiotg-images

volumes:
  uiotg-images:
